spring:
  application:
    name: warehouse-local

  datasource:
    url: jdbc:h2:mem:warehouse_db;DB_CLOSE_DELAY=-1
    username: sa
    password: p

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create
    #show-sql: true
    #properties:
    #  hibernate.format_sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

app:
  scheduling:
    enabled: false
