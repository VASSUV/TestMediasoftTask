management:
  server:
    port: 9090
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health, info, beans, mappings

spring:
  config:
    activate:
      on-profile: default
  application:
    name: warehouse

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        default_schema: warehouse_app
        format_sql: true

  liquibase:
    default-schema: warehouse_app
    change-log: classpath:db/changelog/db.changelog-master.xml

  aop:
    auto: true

#  security:
#    oauth2:
#      resourceserver:
#        jwt:
#          jwk-set-uri: https://rhumb.mediasoft.team/rhumb-auth-api/auth/.well-known/jwks.json

  cache:
    cache-names: currencies
    type: caffeine
    caffeine:
      spec: expireAfterWrite=60s

  kafka:
    listener:
      ack-mode: manual
    bootstrap-servers:
      - ${KAFKA_BOOTSTRAP_SERVER}
    consumer:
      group-id: test-consumer-group-1
      auto-offset-reset: earliest

s3:
  endpoint: ${S3_ENDPOINT}
  region: us-east-1
  accessKey: ${S3_ACCESS_KEY}
  secretKey: ${S3_SECRET_KEY}
  bucket: product-images
app:
  scheduling:
    enabled: false

scheduling:
  optimization: false
  price-change:
    simple:
      cron: "0 * * * * ?"
      percent: -0.01f
      batch-size: 100000
      export-file-path: export/products_simple.csv
    optimized:
      cron: "0 * * * * ?"
      percent: 0.01f
      batch-size: 100000
      export-file-path: export/products.csv
    entity-manager:
      enabled: false
      cron: "0 * * * * ?"
      percent: 0.01f
      batch-size: 100000
      export-file-path: export/products.csv

rest:
  inn:
    mock-enabled: false
    host: ${INN_SERVICE_HOST:http://inn-service}
    methods:
      inns: /api/inns
  account-number:
    mock-enabled: false
    host: ${ACCOUNT_NUMBER_SERVICE_HOST:http://account-number-service}
    methods:
      accountNumbers: /api/account-numbers
  currency:
    mock-enabled: false
    host: ${CURRENCY_SERVICE_HOST:http://currency-service}
    methods:
      currencies: /api/currencies
  contract:
    mock-enabled: false
    host: ${CONTRACT_SERVICE_HOST:http://contract-service}
    methods:
      contract: /api/contract
      contractEnable: /api/contract/enable
  delivery:
    mock-enabled: false
    host: ${DELIVERY_SERVICE_HOST:http://delivery-service}
    methods:
      register: /api/register
      complete: /api/delivery/complete
  payment:
    mock-enabled: false
    host: ${PAYMENT_SERVICE_HOST:http://payment-service}
    methods:
      pay: /api/pay


#logging:
#  level:
#    org.springframework.kafka.listener: DEBUG
#    org.springframework.web: DEBUG
#    org.springframework.boot.autoconfigure.web: DEBUG

camunda:
  custom:
    datasource:
      url: ${CAMUNDA_DATASOURCE_URL}
      scheme: ${CAMUNDA_DATASOURCE_SCHEME}
      username: ${CAMUNDA_DATASOURCE_USERNAME}
      password: ${CAMUNDA_DATASOURCE_PASSWORD}
  bpm:
    auto-deployment-enabled: true
    webapp:
      enabled: false
    default-serialization-format: application/json
    history-level: auto
    database:
      schema-update: true
    admin-user:
      id: ${CAMUNDA_USERNAME}
      password: ${CAMUNDA_PASSWORD}
      email: ${CAMUNDA_USERNAME}@vassuv.ru
      firstName: ${CAMUNDA_USERNAME}
    metrics:
      enabled: false
      db-reporter-activate: false


---

spring:
  config:
    activate:
      on-profile: test
  application:
    name: warehouse

  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
