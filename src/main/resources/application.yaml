
management:
  server:
    port: 9090
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health, info, beans, mappings

spring:
  config:
    activate:
      on-profile: default
  application:
    name: warehouse

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate.format_sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml

  aop:
    auto: true

  cache:
    cache-names: currencies
    type: caffeine
    caffeine:
      spec: expireAfterWrite=60s

app:
  scheduling:
    enabled: false

scheduling:
  optimization: false
  price-change:
    simple:
      cron: "0 * * * * ?"
      percent: -0.01f
      batch-size: 100000
      export-file-path: export/products_simple.csv
    optimized:
      cron: "0 * * * * ?"
      percent: 0.01f
      batch-size: 100000
      export-file-path: export/products.csv
    entity-manager:
      enabled: false
      cron: "0 * * * * ?"
      percent: 0.01f
      batch-size: 100000
      export-file-path: export/products.csv

rest:
  currency:
    mock-enabled: false
    host: http://localhost:8082
    methods:
      currencies: /api/currencies

---

spring:
  config:
    activate:
      on-profile: test
  application:
    name: warehouse

  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
