spring.application.name=warehouse-local

# H2 Конфигурация базы данных
spring.datasource.url=jdbc:h2:mem:warehouse_db;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.settings.web-allow-others=true

# Liquibase для H2
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

# Конфигурация Hibernate для создания схемы
spring.jpa.hibernate.ddl-auto=create

# Включить веб-консоль H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Логирование SQL-запросов
#spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.format_sql=true

# Конфигурация планировщика задач
app.scheduling.enabled=false