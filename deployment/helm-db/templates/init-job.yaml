apiVersion: batch/v1
kind: Job
metadata:
  name: db-init
  namespace: {{ .Values.namespace }}
spec:
  template:
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "Waiting for PostgreSQL to be ready...";
              until nc -z {{ .Values.service.db.host }} {{ .Values.service.db.port }}; do
                sleep 2;
              done;
              echo "PostgreSQL is up!";
      containers:
        - name: psql
          image: postgres:15
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "chart.fullname" . }}-secret
                  key: SPRING_DATASOURCE_PASSWORD
          command: [ "psql" ]
          args:
            - "-h"
            - "{{ .Values.service.db.host }}"
            - "-U"
            - "{{ .Values.service.db.username }}"
            - "-d"
            - "{{ .Values.service.db.dbname }}"
            - "-f"
            - "/scripts/init.sql"
          volumeMounts:
            - name: sql-volume
              mountPath: /scripts
      restartPolicy: OnFailure
      volumes:
        - name: sql-volume
          configMap:
            name: db-init-sql
