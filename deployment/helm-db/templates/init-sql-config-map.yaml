    ALTER USER account_number_user SET search_path TO account_number_service;

    CREATE SCHEMA delivery_service;
    CREATE USER delivery_user WITH PASSWORD 'delivery_pass';
    GRANT USAGE, CREATE ON SCHEMA delivery_service TO delivery_user;
    ALTER DEFAULT PRIVILEGES IN SCHEMA delivery_service GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO delivery_user;
