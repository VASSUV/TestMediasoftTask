    GRANT USAGE, CREATE ON SCHEMA payment_service TO payment_user;
    ALTER DEFAULT PRIVILEGES IN SCHEMA payment_service GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO payment_user;
    GRANT USAGE, CREATE ON SCHEMA public TO payment_user;
    ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE, REFERENCES, TRUNCATE, TRIGGER ON TABLES TO payment_user;
