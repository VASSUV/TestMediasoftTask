    GRANT USAGE, CREATE ON SCHEMA public TO currency_user;
    ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE, REFERENCES, TRUNCATE, TRIGGER ON TABLES TO currency_user;
    ALTER USER currency_user SET search_path TO currency_service;

