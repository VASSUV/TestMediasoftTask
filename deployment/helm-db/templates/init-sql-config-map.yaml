apiVersion: v1
kind: ConfigMap
metadata:
  name: db-init-sql
  namespace: {{ .Values.namespace }}
data:
  init.sql: |
    -- Пример SQL:
    CREATE SCHEMA warehouse_app;
    CREATE USER warehouse_user WITH PASSWORD 'warehouse_pass';
    GRANT USAGE, CREATE ON SCHEMA warehouse_app TO warehouse_user;
    ALTER DEFAULT PRIVILEGES IN SCHEMA warehouse_app GRANT SELECT, INSERT, UPDATE, DELETE, REFERENCES, TRUNCATE, TRIGGER ON TABLES TO warehouse_user;
    GRANT USAGE, CREATE ON SCHEMA public TO warehouse_user;
    ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE, REFERENCES, TRUNCATE, TRIGGER ON TABLES TO warehouse_user;
    ALTER USER warehouse_user SET search_path TO warehouse_app;

    CREATE SCHEMA camunda_service;
    CREATE USER camunda_user WITH PASSWORD 'camunda_pass';
    GRANT USAGE, CREATE ON SCHEMA camunda_service TO camunda_user;
    ALTER DEFAULT PRIVILEGES IN SCHEMA camunda_service GRANT SELECT, INSERT, UPDATE, DELETE, REFERENCES, TRUNCATE, TRIGGER ON TABLES TO camunda_user;
    GRANT USAGE, CREATE ON SCHEMA public TO camunda_user;
    ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE, REFERENCES, TRUNCATE, TRIGGER ON TABLES TO camunda_user;
    ALTER USER camunda_user SET search_path TO camunda_service;

    CREATE SCHEMA currency_service;
