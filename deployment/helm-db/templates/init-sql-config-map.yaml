    GRANT USAGE, CREATE ON SCHEMA contract_service TO contract_user;
    ALTER DEFAULT PRIVILEGES IN SCHEMA contract_service GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO contract_user;
