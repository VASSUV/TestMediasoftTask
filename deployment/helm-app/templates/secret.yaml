apiVersion: v1
kind: Secret
metadata:
  name: {{ include "chart.fullname" . }}-secret
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.appName }}
type: Opaque
stringData:
  DATABASE_NAME: {{ .Values.service.db.dbname }}
  SPRING_DATASOURCE_URL: {{ printf "%s/%s?currentSchema=%s" .Values.config.warehouseDatabaseHost .Values.service.db.dbname .Values.service.db.dbschema  }}
  DATABASE_SCHEMA: {{ .Values.service.db.dbschema }}
  SPRING_DATASOURCE_USERNAME: {{ .Values.service.db.username }}
  SPRING_DATASOURCE_PASSWORD: {{ .Values.service.db.password }}
  CAMUNDA_DATASOURCE_URL: {{ printf "%s/%s?currentSchema=%s" .Values.config.warehouseDatabaseHost .Values.service.db.dbname .Values.camunda.db.scheme }}
  CAMUNDA_DATASOURCE_USERNAME: {{ .Values.camunda.db.username }}
  CAMUNDA_DATASOURCE_PASSWORD: {{ .Values.camunda.db.password }}
  CAMUNDA_DATASOURCE_SCHEME: {{ .Values.camunda.db.scheme }}
  CAMUNDA_USERNAME: {{ .Values.camunda.username }}
  CAMUNDA_PASSWORD: {{ .Values.camunda.password }}

