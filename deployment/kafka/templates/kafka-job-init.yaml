apiVersion: batch/v1
kind: Job

metadata:
  name: kafka-init
  labels:
    app: {{ .Values.kafka.labels.app }}

spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init-kafka
          image: {{ .Values.kafka.image }}
          command:
            - sh
            - -c
            - |
              kafka-storage format \
              --ignore-formatted \
              --cluster-id {{ .Values.kafka.clusterId }} \
              --config /config/kafka.properties
          env:
            - name: KAFKA_KRAFT_MODE
              value: "true"
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "1@kafka-0.kafka-kraft-kafka:9093" #"0@localhost:9093"
            - name: KAFKA_NODE_ID
              value: "1" # "0"
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093" # "PLAINTEXT://:9092,CONTROLLER://:9093"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://kafka-kraft-kafka:9092"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "PLAINTEXT"
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "true"
            - name: CLUSTER_ID
              value: "{{ .Values.kafka.clusterId }}"
          volumeMounts:
            - name: data
              mountPath: {{ .Values.kafka.logDir }}
            - name: config
              mountPath: /config
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: data-kafka-0
        - name: config
          configMap:
            name: kafka-config