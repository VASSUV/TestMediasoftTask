apiVersion: v1
kind: Service
metadata:
  name: {{ include "chart.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.appName }}
spec:
  selector:
    app: {{ .Values.appName }}
  type: {{ .Values.service.type }}

  ports:
    - name: app
      protocol: TCP
      port: 8088
      targetPort: 8080
    - name: actuator
      protocol: TCP
      port: 9099
      targetPort: 9090
