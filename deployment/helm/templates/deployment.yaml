apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "chart.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.appName }}
spec:
#  strategy:
#    type: RollingUpdate #еще есть Recreate
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.appName }}
  template:
    metadata:
      labels:
        app: {{ .Values.appName }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8080
              name: app
            - containerPort: 9090
              name: actuator
          env:
            - name: KAFKA_BOOTSTRAP_SERVER
              value: kafka-0.kafka-kraft-kafka.default.svc.cluster.local:9092
            - name: INN_SERVICE_HOST
              value: {{ .Values.config.innServiceHost }}
            - name: ACCOUNT_NUMBER_SERVICE_HOST
              value: {{ .Values.config.accountNumberServiceHost }}
            - name: CURRENCY_SERVICE_HOST
              value: {{ .Values.config.currencyServiceHost }}
            - name: S3_ACCESS_KEY
              value: Eh59CpibU82HXoShIkzE
            - name: S3_SECRET_KEY
              value: oNN37CSI8WQAUnufXlzJr6zjLVxxrecyq6kFgxbr
            - name: S3_ENDPOINT
              value: http://minio.minio.svc.cluster.local:9000
          envFrom:
            - configMapRef:
                name: {{ include "chart.fullname" . }}-config
            - secretRef:
                name: {{ include "chart.fullname" . }}-secret

{{/*          resources:*/}}
{{/*            limits:*/}}
{{/*              memory: 512Mi*/}}
{{/*              cpu: "500m"*/}}
{{/*            requests:*/}}
{{/*              memory: 256Mi*/}}
{{/*              cpu: "250m"*/}}
{{/*          resources:*/}}
{{/*            {{- toYaml .Values.resources | nindent 12 }}*/}}

          livenessProbe:
            httpGet:
              port: 9090
              path: /actuator/health
            failureThreshold: 3
            periodSeconds: 10
          readinessProbe:
            httpGet:
              port: 9090
              path: /actuator/health
            failureThreshold: 1
            periodSeconds: 10
          startupProbe:
            httpGet:
              port: 9090
              path: /actuator/health
            failureThreshold: 30
            periodSeconds: 10

